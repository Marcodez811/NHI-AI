name: Build fixed NHI-AI package

on:
  push:
    branches:
      - chatgpt/fix-kb-bugs-20260901

permissions:
  contents: read

jobs:
  fix-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out packaging branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-kb-bugs-20260901
          fetch-depth: 1

      - name: Apply fixes
        run: python tools/apply_chatgpt_fixes.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip uv
          cd backend
          uv sync --dev

      - name: Run backend tests
        env:
          REDIS_URL: redis://localhost:6379/0
          OPENAI_API_KEY: sk-test-placeholder
          DATABASE_URL: sqlite:///./test-ci.db
        run: |
          cd backend
          uv run pytest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend checks
        run: |
          cd frontend
          npm ci
          npm run typecheck
          npm test

      - name: Prepare package
        run: |
          rm -f .github/workflows/chatgpt-fix-package.yml
          rm -f tools/apply_chatgpt_fixes.py
          rm -rf backend/.venv frontend/node_modules package
          mkdir -p package/NHI-AI-fixed
          rsync -a --exclude='.git' --exclude='package' ./ package/NHI-AI-fixed/
          printf '%s\n' 'Base commit: 7f712cc23e674a8ed25efc2e13edcaecbfa4d0b7' > package/NHI-AI-fixed/FIXED_BUILD.txt
          printf '%s\n' 'Validated fixes: server-owned vector store; DB-enforced enabled-document scope; in-place category metadata update; queue-failure source preservation; settings-backed chat client.' >> package/NHI-AI-fixed/FIXED_BUILD.txt

      - name: Upload fixed repository
        uses: actions/upload-artifact@v4
        with:
          name: NHI-AI-fixed
          path: package/NHI-AI-fixed
          if-no-files-found: error
          retention-days: 7
