name: Build fixed NHI-AI package

on:
  push:
    branches:
      - chatgpt/fix-kb-bugs-20260901

permissions:
  contents: read

jobs:
  fix-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply retrieval and document consistency fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch context not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1. The public request contract must never accept a provider vector-store ID.
          replace(
              "backend/app/models/chat.py",
              '''    # This is useful for isolated clients and tests. Production callers should\n    # leave it unset so the injected provider/configuration selects the index.\n    vector_store_id: str | None = Field(default=None, min_length=1)\n''',
              "",
          )
          replace(
              "frontend/lib/api.ts",
              '''    vector_store_id?: string;\n''',
              "",
          )
          replace(
              "backend/app/services/chat/responder.py",
              '''    def resolve_vector_store_id(self, explicit_id: str | None = None) -> str:\n        value = explicit_id or self._vector_store_id or self._vector_store_id_provider()\n''',
              '''    def resolve_vector_store_id(self) -> str:\n        value = self._vector_store_id or self._vector_store_id_provider()\n''',
          )
          replace(
              "backend/app/services/chat/responder.py",
              '''        vector_store_id = self.resolve_vector_store_id(request.vector_store_id)\n''',
              '''        vector_store_id = self.resolve_vector_store_id()\n''',
          )

          # 2. Resolve category-wide chat to the exact set of DB-eligible documents.
          replace(
              "backend/app/api/routes/chat.py",
              '''async def _validate_document_scope(request: ChatRequest, repository: DocumentRepository) -> None:\n    # An empty catalog is a normal first-run state.  Return a stable conflict\n    # contract so the UI can direct the user to upload a source instead of\n    # sending a guaranteed-unproductive Responses API request.\n    if not request.document_ids:\n        ready_documents = await repository.list_documents(\n            category=request.mode,\n            status=DocumentStatus.READY,\n            retrieval_enabled=True,\n        )\n        if not ready_documents:\n            raise HTTPException(\n                status_code=status.HTTP_409_CONFLICT,\n                detail={\n                    "code": "knowledge_base_empty",\n                    "message": "No retrieval-ready documents are available for this category.",\n                },\n            )\n    for document_id in request.document_ids:\n        document = await repository.get_document(document_id)\n        if document is None:\n            raise HTTPException(status_code=status.HTTP_404_NOT_FOUND, detail="A selected document was not found.")\n        if document.category != request.mode.value:\n            raise HTTPException(status_code=status.HTTP_422_UNPROCESSABLE_ENTITY, detail="Selected documents must match the chat category.")\n        if document.status != DocumentStatus.READY.value or not document.retrieval_enabled:\n            raise HTTPException(status_code=status.HTTP_409_CONFLICT, detail="Selected documents are not ready for retrieval.")\n''',
              '''async def _resolve_document_scope(request: ChatRequest, repository: DocumentRepository) -> ChatRequest:\n    """Resolve the public chat scope to DB-authorized document IDs.\n\n    Provider metadata is not authoritative for enable/disable state.  Every\n    request therefore carries an explicit document-id filter derived from the\n    catalog, including category-wide requests.\n    """\n\n    if not request.document_ids:\n        ready_documents = await repository.list_documents(\n            category=request.mode,\n            status=DocumentStatus.READY,\n            retrieval_enabled=True,\n        )\n        if not ready_documents:\n            raise HTTPException(\n                status_code=status.HTTP_409_CONFLICT,\n                detail={\n                    "code": "knowledge_base_empty",\n                    "message": "No retrieval-ready documents are available for this category.",\n                },\n            )\n        return request.model_copy(update={"document_ids": [document.id for document in ready_documents]})\n\n    for document_id in request.document_ids:\n        document = await repository.get_document(document_id)\n        if document is None:\n            raise HTTPException(status_code=status.HTTP_404_NOT_FOUND, detail="A selected document was not found.")\n        if document.category != request.mode.value:\n            raise HTTPException(status_code=status.HTTP_422_UNPROCESSABLE_ENTITY, detail="Selected documents must match the chat category.")\n        if document.status != DocumentStatus.READY.value or not document.retrieval_enabled:\n            raise HTTPException(status_code=status.HTTP_409_CONFLICT, detail="Selected documents are not ready for retrieval.")\n    return request\n''',
          )
          replace(
              "backend/app/api/routes/chat.py",
              '''    await _validate_document_scope(request, repository)\n    try:\n        return service.answer(request)\n''',
              '''    request = await _resolve_document_scope(request, repository)\n    try:\n        return service.answer(request)\n''',
          )
          replace(
              "backend/app/api/routes/chat.py",
              '''    await _validate_document_scope(request, repository)\n    events: Generator[str, None, None] = service.answer_stream(request)\n''',
              '''    request = await _resolve_document_scope(request, repository)\n    events: Generator[str, None, None] = service.answer_stream(request)\n''',
          )

          # 3. Recategorization updates vector-store attributes in place instead of uploading a duplicate.
          replace(
              "backend/app/tasks/documents.py",
              '''        def load_source_and_mark_indexing() -> tuple[Path, str]:\n''',
              '''        def load_source_and_mark_indexing() -> tuple[Path, str, str | None, str | None]:\n''',
          )
          replace(
              "backend/app/tasks/documents.py",
              '''                source = LocalDocumentStorage(settings.documents_root).resolve(document.id)\n                return source, document.original_filename\n\n        source, filename = await asyncio.to_thread(load_source_and_mark_indexing)\n\n        def upload_and_attach() -> tuple[str, str]:\n''',
              '''                source = LocalDocumentStorage(settings.documents_root).resolve(document.id)\n                return source, document.original_filename, document.remote_file_id, document.remote_vector_store_id\n\n        source, filename, existing_remote_file_id, existing_vector_store_file_id = await asyncio.to_thread(\n            load_source_and_mark_indexing\n        )\n\n        def upload_and_attach() -> tuple[str, str]:\n''',
          )
          replace(
              "backend/app/tasks/documents.py",
              '''            client = OpenAI(api_key=settings.openai_api_key)\n            with source.open("rb") as handle:\n                uploaded = client.files.create(file=handle, purpose="assistants")\n            attributes = {\n                "filename": filename,\n                "document_id": str(payload.document_id),\n                "qa_set": payload.category.value,\n                "content_type": "markdown_wiki" if payload.category is DocumentCategory.BEI_CAN else "source",\n                "is_news_source": "false",\n            }\n            attached = client.vector_stores.files.create(\n                vector_store_id=vector_store_id,\n                file_id=uploaded.id,\n                attributes=attributes,\n            )\n            return str(uploaded.id), str(getattr(attached, "id", uploaded.id))\n''',
              '''            client = OpenAI(api_key=settings.openai_api_key)\n            attributes = {\n                "filename": filename,\n                "document_id": str(payload.document_id),\n                "qa_set": payload.category.value,\n                "content_type": "markdown_wiki" if payload.category is DocumentCategory.BEI_CAN else "source",\n                "is_news_source": "false",\n            }\n            if existing_remote_file_id and existing_vector_store_file_id:\n                client.vector_stores.files.update(\n                    vector_store_id=vector_store_id,\n                    file_id=existing_vector_store_file_id,\n                    attributes=attributes,\n                )\n                return existing_remote_file_id, existing_vector_store_file_id\n\n            with source.open("rb") as handle:\n                uploaded = client.files.create(file=handle, purpose="assistants")\n            attached = client.vector_stores.files.create(\n                vector_store_id=vector_store_id,\n                file_id=uploaded.id,\n                attributes=attributes,\n            )\n            return str(uploaded.id), str(getattr(attached, "id", uploaded.id))\n''',
          )

          # 4. A queue outage leaves a retryable failed row; preserve its source bytes too.
          replace(
              "backend/app/api/routes/documents.py",
              '''    except Exception as exc:\n        try:\n            await storage.delete(document_id)\n        except Exception:\n            pass\n        if isinstance(exc, HTTPException):\n            raise\n        raise _map_repository_error(exc) from exc\n''',
              '''    except Exception as exc:\n        # Queueing failures intentionally persist a FAILED catalog row/job so\n        # operators can retry them.  Keep the source bytes in the same case;\n        # otherwise the persisted retry state points at a missing source.\n        if isinstance(exc, HTTPException):\n            raise\n        try:\n            await storage.delete(document_id)\n        except Exception:\n            pass\n        raise _map_repository_error(exc) from exc\n''',
          )

          # 5. Use the already-validated Pydantic settings key for chat rather than os.environ.
          replace(
              "backend/app/main.py",
              '''import redis.asyncio as redis\nfrom fastapi import FastAPI, HTTPException, status\n''',
              '''import redis.asyncio as redis\nfrom fastapi import FastAPI, HTTPException, status\nfrom openai import OpenAI\n''',
          )
          replace(
              "backend/app/main.py",
              '''app.dependency_overrides[get_chat_service] = lambda: ResponseService(\n    vector_store_id_provider=_runtime_vector_store_id,\n''',
              '''app.dependency_overrides[get_chat_service] = lambda: ResponseService(\n    client=OpenAI(api_key=settings.openai_api_key),\n    vector_store_id_provider=_runtime_vector_store_id,\n''',
          )

          # Update existing chat unit tests so vector-store ownership is service-side.
          replace(
              "backend/tests/services/chat/test_chat.py",
              '''def request(mode=QaMode.LEGISLATIVE_QA, **kwargs):\n    return ChatRequest(question="政策問題", mode=mode, vector_store_id="vs_test", **kwargs)\n''',
              '''def request(mode=QaMode.LEGISLATIVE_QA, **kwargs):\n    return ChatRequest(question="政策問題", mode=mode, **kwargs)\n''',
          )
          text_path = Path("backend/tests/services/chat/test_chat.py")
          text = text_path.read_text()
          text = text.replace('ResponseService(client=client, model="test-model")', 'ResponseService(client=client, model="test-model", vector_store_id="vs_test")')
          text = text.replace('ResponseService(client=FakeClient(_response(citations=False)), model="test-model")', 'ResponseService(client=FakeClient(_response(citations=False)), model="test-model", vector_store_id="vs_test")')
          text_path.write_text(text)

          # Regression coverage for security ownership and enabled-document scoping.
          Path("backend/tests/api/test_chat_scope_regressions.py").write_text(r'''from uuid import uuid4

import pytest

from app.api.routes.chat import _resolve_document_scope
from app.models.chat import ChatRequest, QaMode
from app.models.documents import Document, DocumentCategory, DocumentStatus
from app.services.chat.responder import ResponseService
from app.services.documents.repository import InMemoryDocumentRepository


def make_document(*, retrieval_enabled: bool) -> Document:
    return Document(
        original_filename="brief.pdf",
        display_name="brief.pdf",
        mime_type="application/pdf",
        extension=".pdf",
        size_bytes=1,
        checksum=str(uuid4()),
        category=DocumentCategory.LEGISLATIVE_QA.value,
        storage_key="ignored",
        status=DocumentStatus.READY.value,
        stage="ready",
        retrieval_enabled=retrieval_enabled,
    )


@pytest.mark.asyncio
async def test_category_scope_contains_only_retrieval_enabled_document_ids():
    repo = InMemoryDocumentRepository()
    enabled = make_document(retrieval_enabled=True)
    disabled = make_document(retrieval_enabled=False)
    await repo.create_document(enabled)
    await repo.create_document(disabled)

    request = ChatRequest(question="政策", mode=QaMode.LEGISLATIVE_QA)
    resolved = await _resolve_document_scope(request, repo)

    assert resolved.document_ids == [enabled.id]
    assert disabled.id not in resolved.document_ids


def test_client_vector_store_override_is_ignored_by_public_contract():
    request = ChatRequest.model_validate({
        "question": "政策",
        "mode": QaMode.LEGISLATIVE_QA,
        "vector_store_id": "vs_untrusted",
    })
    service = ResponseService(vector_store_id="vs_trusted", model="test-model")

    built = service.build_request(request)

    assert not hasattr(request, "vector_store_id")
    assert built["tools"][0]["vector_store_ids"] == ["vs_trusted"]
''')

          # Static regression guard: recategorization must use attribute update, not duplicate upload.
          Path("backend/tests/tasks/test_reindex_regressions.py").write_text(r'''from pathlib import Path


def test_recategorization_path_updates_existing_vector_store_file_in_place():
    source = Path("app/tasks/documents.py").read_text()
    assert "if existing_remote_file_id and existing_vector_store_file_id:" in source
    assert "client.vector_stores.files.update(" in source
    assert "return existing_remote_file_id, existing_vector_store_file_id" in source
''')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv and backend dependencies
        run: |
          python -m pip install --upgrade pip uv
          cd backend
          uv sync --dev

      - name: Run backend tests
        env:
          REDIS_URL: redis://localhost:6379/0
          OPENAI_API_KEY: sk-test-placeholder
          DATABASE_URL: sqlite:///./test-ci.db
        run: |
          cd backend
          uv run pytest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend checks
        run: |
          cd frontend
          npm ci
          npm run typecheck
          npm test

      - name: Prepare fixed repository tree
        if: success()
        run: |
          mkdir -p package/NHI-AI-fixed
          rsync -a --exclude='.git' --exclude='package' --exclude='backend/.venv' --exclude='frontend/node_modules' ./ package/NHI-AI-fixed/
          printf '%s\n' 'Base commit: 7f712cc23e674a8ed25efc2e13edcaecbfa4d0b7' > package/NHI-AI-fixed/FIXED_BUILD.txt
          printf '%s\n' 'Fixes: server-owned vector store, DB-enforced retrieval_enabled scope, in-place category metadata update, queue-failure source preservation, settings-backed chat client.' >> package/NHI-AI-fixed/FIXED_BUILD.txt

      - name: Upload fixed repository
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NHI-AI-fixed
          path: package/NHI-AI-fixed
          if-no-files-found: error
          retention-days: 7
