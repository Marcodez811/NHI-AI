[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi[standard]>=0.141.1",
    "lxml>=6.0.0",
    "loguru>=0.7.3",
    "openai>=3.3.1",
    "openai-codex>=0.147.0",
    "pdfplumber>=0.11.8",
    "pillow>=11.0.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2.0",
    "pypdf>=5.0.0",
    "pypdfium2>=4.30.0",
    "pytesseract>=0.3.13",
    "redis>=8.1.0",
    "sqlmodel>=0.0.39",
    "taskiq>=0.12.4",
    "taskiq-redis>=1.2.3",
    "uvicorn[standard]>=0.52.4",
    "alembic>=1.19.1",
    "openai-agents[litellm]>=0.22.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
